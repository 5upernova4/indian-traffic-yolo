name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit tests (no model, no dataset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy opencv-python-headless pytest
      - run: pytest

  smoke:
    name: model smoke test (CPU, ONNX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only torch + runtime deps
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics onnxruntime opencv-python-headless lap flask pytest
      - run: pytest tests/test_smoke_model.py -v
